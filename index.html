<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vertical Genomic Sequence</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="genomic-background"></div>

  <script>
    function generateSequence(length) {
      const bases = ['A', 'G', 'C', 'T'];
      let sequence = '';
      for (let i = 0; i < length; i++) {
        sequence += bases[Math.floor(Math.random() * bases.length)];
      }
      return sequence;
    }

    function fillVertical() {
      const lines = 1000; // Number of lines to fill vertically
      const lineLength = 60; // Length of each line
      let content = '';

      for (let i = 0; i < lines; i++) {
        content += generateSequence(lineLength) + '\n';
      }

      document.getElementById('genomic-background').textContent = content;
    }

    fillVertical();
  </script>
</body>
</html>
