<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full-Page Genomic Sequence</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="genomic-background"></div>

  <script>
    function generateSequenceLine(length) {
      const bases = ['A', 'G', 'C', 'T'];
      let sequence = '';
      for (let i = 0; i < length; i++) {
        sequence += bases[Math.floor(Math.random() * bases.length)];
      }
      return sequence;
    }

    function fillPage() {
      const backgroundDiv = document.getElementById('genomic-background');
      const viewportHeight = window.innerHeight;
      const viewportWidth = window.innerWidth;
      const lineLength = Math.floor(viewportWidth / 10); // Adjust characters per line
      const lineHeight = 12; // Approx. height of each line in pixels
      const numLines = Math.ceil(viewportHeight / lineHeight) * 2; // Ensure full coverage

      let content = '';
      for (let i = 0; i < numLines; i++) {
        content += generateSequenceLine(lineLength) + '\n';
      }

      backgroundDiv.textContent = content;
    }

    fillPage();
    window.addEventListener('resize', fillPage); // Redraw on window resize
  </script>
</body>
</html>
