<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genomic Sequence Background</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="genomic-background"></div>

  <script>
    function generateSequence(length) {
      const bases = ['A', 'G', 'C', 'T'];
      let sequence = '';
      for (let i = 0; i < length; i++) {
        sequence += bases[Math.floor(Math.random() * bases.length)];
      }
      return sequence;
    }

    function fillBackground() {
      const sequenceDiv = document.getElementById('genomic-background');
      const charCount = 100000; // Adjust for more sequence
      sequenceDiv.textContent = generateSequence(charCount);
    }

    fillBackground();
  </script>
</body>
</html>
